name: Fork F06 — Source-Pinned Signed Manager Qualification

# Manual, reviewed source and protected persistent signer; no publication.
run-name: F06/${{ inputs.reservation_id }}/${{ inputs.version_code }}/${{ inputs.fork_sha }}

on:
  workflow_dispatch:
    inputs:
      reservation_id:
        description: Reviewed journal reservation SHA-256
        type: string
        required: true
      version_code:
        description: Exact reserved global versionCode
        type: string
        required: true
      fork_sha:
        description: Expected fork default-branch workflow HEAD
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: fork-f06-sign-${{ inputs.reservation_id }}
  cancel-in-progress: false

jobs:
  signed-manager-qualification:
    if: github.repository == 'Mikeyphw/BakaSU' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: fork-signing
    steps:
      - name: Checkout exact reviewed workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate all existing fork contracts
        run: |
          python3 -B scripts/fork/source_contract.py --check
          python3 -B -m unittest discover -s scripts/fork/tests -p 'test_*.py' -v
      - name: Verify promoted committed tree and reserved version (no upstream merge)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          F06_RESERVATION: ${{ inputs.reservation_id }}
          F06_VERSION: ${{ inputs.version_code }}
          F06_FORK_SHA: ${{ inputs.fork_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$F06_VERSION" =~ ^[1-9][0-9]{0,9}$ ]]
          mkdir -m 700 "$RUNNER_TEMP/f06"
          python3 -B scripts/fork/f06_signing.py stage \
            --reservation-id "$F06_RESERVATION" --version-code "$F06_VERSION" \
            --fork-sha "$F06_FORK_SHA" --checkout "$RUNNER_TEMP/f06/source" \
            --output "$RUNNER_TEMP/f06/f06-promoted-source.json"
      - name: Revalidate actual promoted source before unlocking signer
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/f06/source"
          python3 -B scripts/fork/source_contract.py --check
          python3 -B -m unittest discover -s scripts/fork/tests -p 'test_*.py' -v
      - name: Setup Java 21 and hosted Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle without credential-bearing caches
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Prepare persistent signing identity (no key in logs or output)
        env:
          FORK_SIGNER_KEYSTORE_B64: ${{ secrets.FORK_SIGNER_KEYSTORE_B64 }}
          FORK_SIGNER_STORE_PASSWORD: ${{ secrets.FORK_SIGNER_STORE_PASSWORD }}
          FORK_SIGNER_KEY_ALIAS: ${{ secrets.FORK_SIGNER_KEY_ALIAS }}
          FORK_SIGNER_KEY_PASSWORD: ${{ secrets.FORK_SIGNER_KEY_PASSWORD }}
          FORK_SIGNER_CERT_SHA256: ${{ secrets.FORK_SIGNER_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/fork/f06_signing.py prepare \
            --source "$RUNNER_TEMP/f06/f06-promoted-source.json" \
            --manager "$RUNNER_TEMP/f06/source/manager" --scratch "$RUNNER_TEMP/f06"
      - name: Build reviewed fork source at the reserved version (hosted only)
        env:
          F06_VERSION: ${{ inputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$F06_VERSION" =~ ^[1-9][0-9]{0,9}$ ]]
          cd "$RUNNER_TEMP/f06/source/manager"
          ./gradlew spotlessCheck :app:assembleRelease \
            -PKSU_PACKAGE_NAME=com.mikeyphw.bakasu \
            -PBAKASU_RESERVED_VERSION_CODE="$F06_VERSION" \
            --no-configuration-cache --no-daemon
      - name: Verify every APK signature and reserved package version
        env:
          FORK_SIGNER_CERT_SHA256: ${{ secrets.FORK_SIGNER_CERT_SHA256 }}
          EXPECTED_FORK_SHA: ${{ inputs.fork_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/fork/f06_signing.py verify \
            --source "$RUNNER_TEMP/f06/f06-promoted-source.json" \
            --checkout "$RUNNER_TEMP/f06/source" \
            --apk-dir "$RUNNER_TEMP/f06/source/manager/app/build/outputs/apk/release" \
            --output "$RUNNER_TEMP/f06/f06-signed-provenance.json" \
            --fork-sha "$EXPECTED_FORK_SHA"
      - name: Scrub ephemeral Gradle signing properties and keystore
        if: always()
        shell: bash
        run: |
          python3 -B scripts/fork/f06_signing.py cleanup \
            --manager "$RUNNER_TEMP/f06/source/manager" --scratch "$RUNNER_TEMP/f06"
      - name: Upload exact attempt signer provenance (not release qualification)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: f06-source-and-signer-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/f06/f06-promoted-source.json
            ${{ runner.temp }}/f06/f06-signed-provenance.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload exact attempt signed diagnostic APKs (NOT a GitHub release)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: f06-signed-manager-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f06/source/manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
