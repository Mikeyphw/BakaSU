name: Fork Manager Baseline Qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-manager-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact checkout, source and workflow contracts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 -B scripts/fork/ci_gate.py source
      - name: Reconcile current required workflow registrations (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/fork/ci_inventory.py --github-api

  manager-debug:
    needs: source-contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify same source as prerequisite
        run: python3 -B ../scripts/fork/ci_gate.py checkout
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Run the SAME formatter as upstream Lints Check. Produce a reviewable
      # patch artifact on failure, never auto-commit or silently relax lint.
      - name: Check manager formatting
        id: spotless
        continue-on-error: true
        run: ./gradlew spotlessCheck --no-configuration-cache --no-daemon
      - name: Prepare exact formatter diff for diagnostics
        if: steps.spotless.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew spotlessApply --no-configuration-cache --no-daemon
          git -C "$GITHUB_WORKSPACE" diff --binary -- manager/ > "$GITHUB_WORKSPACE/bakasu-format-fix.patch"
          test -s "$GITHUB_WORKSPACE/bakasu-format-fix.patch"
      - name: Upload formatting patch for review
        if: steps.spotless.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: bakasu-spotless-fix-${{ github.sha }}
          path: bakasu-format-fix.patch
          retention-days: 7
          if-no-files-found: warn
      - name: Enforce formatting gate
        if: steps.spotless.outcome == 'failure'
        run: |
          echo 'BK_F02_FORMAT_REFUSED: download formatter patch artifact; never skip spotlessCheck'
          exit 1
      - name: Build manager only (no kernel/ksud or release signing)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK for CI inspection (NOT a release)
        uses: actions/upload-artifact@v7
        with:
          name: fork-manager-baseline-debug-${{ github.sha }}
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  qualification:
    name: Fork Manager Required Result
    if: ${{ always() }}
    needs: [source-contract, manager-debug]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all jobs to succeed
        env:
          SOURCE_RESULT: ${{ needs.source-contract.result }}
          BUILD_RESULT: ${{ needs.manager-debug.result }}
        run: test "$SOURCE_RESULT" = success && test "$BUILD_RESULT" = success
