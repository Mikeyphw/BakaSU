name: Fork Manager Baseline Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/fork-manager-ci.yml'
      - 'manager/**'
      - 'scripts/fork/**'
      - 'docs/FORK_DELIVERY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-manager-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate upstream integration points
        run: python3 -B scripts/fork/source_contract.py --check
      - name: Test contract diagnostics
        run: python3 -B -m unittest discover -s scripts/fork/tests -p 'test_*.py' -v
      - name: Check changed lines for whitespace
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE_SHA" && -n "$PR_HEAD_SHA" ]]; then
            git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA" --
          else
            # Dispatch only compares fork-owned baseline files, not upstream files.
            git diff --check HEAD^ HEAD -- \
              .github/workflows/fork-manager-ci.yml \
              docs/FORK_DELIVERY.md scripts/fork/
          fi

  manager-debug:
    needs: source-contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Run the SAME formatter as upstream Lints Check. Produce a reviewable
      # patch artifact on failure, never auto-commit or silently relax lint.
      - name: Check manager formatting
        id: spotless
        continue-on-error: true
        run: ./gradlew spotlessCheck --no-configuration-cache --no-daemon
      - name: Prepare exact formatter diff for diagnostics
        if: steps.spotless.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew spotlessApply --no-configuration-cache --no-daemon
          git -C "$GITHUB_WORKSPACE" diff --binary -- manager/ > "$GITHUB_WORKSPACE/bakasu-format-fix.patch"
          test -s "$GITHUB_WORKSPACE/bakasu-format-fix.patch"
      - name: Upload formatting patch for review
        if: steps.spotless.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: bakasu-spotless-fix-${{ github.sha }}
          path: bakasu-format-fix.patch
          retention-days: 7
          if-no-files-found: warn
      - name: Enforce formatting gate
        if: steps.spotless.outcome == 'failure'
        run: |
          echo 'BK_F02_FORMAT_REFUSED: download formatter patch artifact; never skip spotlessCheck'
          exit 1
      - name: Build manager only (no kernel/ksud or release signing)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK for CI inspection (NOT a release)
        uses: actions/upload-artifact@v7
        with:
          name: fork-manager-baseline-debug-${{ github.sha }}
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
