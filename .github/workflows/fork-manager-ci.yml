name: Fork Manager Baseline Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/fork-manager-ci.yml'
      - 'manager/**'
      - 'scripts/fork/**'
      - 'docs/FORK_DELIVERY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-manager-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate upstream integration points
        run: python3 -B scripts/fork/source_contract.py --check
      - name: Test contract diagnostics
        run: python3 -B -m unittest discover -s scripts/fork/tests -p 'test_*.py' -v
      - name: Check whitespace
        run: git show --format= --check HEAD

  manager-debug:
    needs: source-contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build manager only (no kernel/ksud or release signing)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK for CI inspection (NOT a release)
        uses: actions/upload-artifact@v7
        with:
          name: fork-manager-baseline-debug-${{ github.sha }}
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
